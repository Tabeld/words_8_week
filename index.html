<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Академический глоссарий</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --primary-color: #4a90e2;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --border-radius: 16px;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* Прогресс-бар */
    .progress-container {
      width: 100%;
      height: 8px;
      background-color: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--success-color);
      transition: width 0.3s ease;
    }
    .progress-text {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: -8px;
    }

    /* Контейнер для карточки */
    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 480px;
      position: relative;
    }

    /* Обертка для свайпа */
    .drag-wrapper {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
      cursor: grab;
      transition: transform 0.3s ease;
      z-index: 2;
    }
    .drag-wrapper:active {
      cursor: grabbing;
    }

    /* Карточка */
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      background-color: var(--card-bg);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Обратная сторона карточки */
    .card-back {
      transform: rotateY(180deg);
      justify-content: flex-start;
      overflow-y: auto;
      text-align: left;
      align-items: flex-start;
      height: 100%;
    }

    .card-front h2 {
      font-size: 28px;
      color: var(--primary-color);
      word-break: break-word;
    }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-back .definition { font-weight: 600; color: var(--text-main); margin-bottom: 12px; line-height: 1.4; font-size: 15px; }
    
    .card-back .context-box {
      background: #f8f9fa; 
      padding: 12px; 
      border-radius: 8px;
      border-left: 4px solid var(--primary-color); 
      margin-top: 8px; 
      width: 100%;
      margin-bottom: 16px;
    }
    .card-back .context-en { font-style: italic; color: #444; font-size: 13px; line-height: 1.4; }

    /* Новый блок: перевод термина под английским примером */
    .card-back .term-translation {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #777; /* Приглушенный серый */
      text-align: right;
      border-top: 1px solid #e0e0e0;
      padding-top: 6px;
    }

    /* Перевод всего предложения внизу */
    .card-back .translation {
      margin-top: auto;
      font-size: 13px;
      color: #999;
      font-weight: 400;
      font-style: italic;
      padding-top: 16px;
      border-top: 1px dashed #e0e0e0;
      width: 100%;
      text-align: center;
    }

    /* Оверлеи для свайпов */
    .overlay {
      position: absolute;
      top: 20px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 20px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .overlay.know {
      right: 20px;
      color: var(--success-color);
      border: 3px solid var(--success-color);
      background: rgba(46, 204, 113, 0.1);
      transform: rotate(15deg);
    }
    .overlay.dont-know {
      left: 20px;
      color: var(--danger-color);
      border: 3px solid var(--danger-color);
      background: rgba(231, 76, 60, 0.1);
      transform: rotate(-15deg);
    }

    /* Кнопки */
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      padding: 14px 10px;
      border: none;
      border-radius: 12px;
      background-color: white;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active { transform: scale(0.96); }

    button.danger { background-color: var(--danger-color); color: white; flex: 1; }
    button.success { background-color: var(--success-color); color: white; flex: 1; }
    button.neutral { background-color: #ffffff; color: var(--text-muted); flex: 0.8; border: 1px solid #ddd; }

    /* Экран завершения */
    .completion-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(5px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      border-radius: var(--border-radius); z-index: 100; text-align: center; padding: 24px;
      display: none;
    }
    .completion-screen h2 { font-size: 24px; margin-bottom: 16px; color: var(--success-color); }
    .completion-screen p { margin-bottom: 24px; color: var(--text-muted); }
    .completion-screen button {
      background-color: var(--primary-color); color: white; padding: 14px 28px; font-size: 16px; width: auto;
    }

    .card-back::-webkit-scrollbar { width: 4px; }
    .card-back::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 50</div>
    
    <div class="card-container" id="cardContainer">
      <div class="overlay know" id="overlayKnow">ЗНАЮ</div>
      <div class="overlay dont-know" id="overlayDontKnow">НЕ ЗНАЮ</div>
      
      <div class="drag-wrapper" id="dragWrapper">
        <div class="card" id="card">
          <div class="card-front">
            <h2 id="keyWord">Word</h2>
            <p class="hint">Нажмите, чтобы перевернуть</p>
          </div>
          <div class="card-back">
            <p class="definition" id="definition"></p>
            
            <!-- Блок контекста с добавленным переводом термина -->
            <div class="context-box">
              <p class="context-en" id="context"></p>
              <p class="term-translation" id="termTranslation"></p> 
            </div>
            
            <p class="translation" id="translation"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="controls" id="controls">
      <button id="dontKnowBtn" class="danger">Не знаю</button>
      <button id="flipBtn" class="neutral">🔄</button>
      <button id="knowBtn" class="success">Знаю</button>
    </div>

    <div class="completion-screen" id="completionScreen">
      <h2>🎉 Отлично!</h2>
      <p>Вы выучили все слова в этой сессии!</p>
      <button id="restartBtn">Начать заново</button>
    </div>
  </div>

  <script>
    // --- ДАННЫЕ (добавлено поле termTranslation) ---
    const glossaryData = [
    { key: "registration", termTranslation: "регистрация", definition: "In medical imaging, the process of spatially aligning two or more images (Medical Imaging Glossary)", context: "This work proposes a registration method based only on geometrical and anatomical information from liver segmentation, aimed at aligning longitudinal liver images for aided diagnosis. [1; p. 1]", translation: "В данной работе предлагается метод регистрации, основанный только на геометрической и анатомической информации из сегментации печени, направленный на выравнивание продольных изображений печени для вспомогательной диагностики." },
    { key: "segmentation", termTranslation: "сегментация", definition: "The process of dividing something into different parts (Cambridge)", context: "This work proposes a registration method based only on geometrical and anatomical information from liver segmentation, aimed at aligning longitudinal liver images for aided diagnosis. [1; p. 1]", translation: "В данной работе предлагается метод регистрации, основанный только на геометрической и анатомической информации из сегментации печени, направленный на выравнивание продольных изображений печени для вспомогательной диагностики." },
    { key: "deformation", termTranslation: "деформация", definition: "The change in shape or size of something (Cambridge)", context: "Indeed, longitudinal liver examinations can undergo different non-pathological and pathological changes due to non-rigid deformations, the appearance or disappearance of pathologies, and other variations. [1; p. 1]", translation: "Действительно, продольные исследования печени могут претерпевать различные непатологические и патологические изменения из-за нежёстких деформаций, появления или исчезновения патологий и других вариаций." },
    { key: "displacement", termTranslation: "смещение", definition: "The act of moving something from its position (Cambridge)", context: "The network predicts a displacement field to align the moving image with the fixed image. [1; p. 2]", translation: "Сеть предсказывает поле смещений, чтобы выровнять движущееся изображение с фиксированным." },
    { key: "alignment", termTranslation: "выравнивание", definition: "The act of arranging things in a straight line or in correct relative positions (Cambridge)", context: "Tools performing automatic alignment of CT scans for precise tumor follow-up may reduce radiologists mental burden. [1; p. 2]", translation: "Инструменты, выполняющие автоматическое выравнивание КТ-сканов для точного наблюдения за опухолью, могут снизить умственную нагрузку радиологов." },
    { key: "monitoring", termTranslation: "мониторинг", definition: "The act of watching and checking something over a period of time (Cambridge)", context: "This monitoring demands considerable effort as practitioners must recognize previously detected lesions, compare them to their counterparts in prior exams, identify any newly appearing tumors, and evaluate the overall evolution of the disease. [1; p. 2]", translation: "Этот мониторинг требует значительных усилий, поскольку практикующие врачи должны распознавать ранее обнаруженные поражения, сравнивать их с аналогами в предыдущих исследованиях, выявлять любые новые появляющиеся опухоли и оценивать общую эволюцию заболевания." },
    { key: "progression", termTranslation: "прогрессирование", definition: "The process of developing or moving gradually towards a more advanced state (Cambridge)", context: "Assessing cancer progression in liver CT scans is a clinical challenge, requiring a comparison of scans at different times for the same patient. [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему, требующую сравнения сканов, сделанных в разное время для одного и того же пациента." },
    { key: "evolution", termTranslation: "эволюция", definition: "The process of developing or changing gradually (Cambridge)", context: "Practitioners must identify existing tumors, compare them with prior exams, identify new tumors, and evaluate overall disease evolution. [1; p. 2]", translation: "Практикующие врачи должны идентифицировать существующие опухоли, сравнивать их с предыдущими исследованиями, выявлять новые опухоли и оценивать общую эволюцию заболевания." },
    { key: "diagnosis", termTranslation: "диагноз", definition: "A judgment about what a particular illness or problem is (Cambridge)", context: "In such cases, existing registration approaches, mainly based on intrinsic features may distort tumor regions, biasing the tumor progress evaluation step and the corresponding diagnosis. [1; p. 1]", translation: "В таких случаях существующие подходы к регистрации, в основном основанные на внутренних признаках, могут искажать области опухоли, смещая этап оценки прогрессирования опухоли и соответствующий диагноз." },
    { key: "tumor", termTranslation: "опухоль", definition: "A mass of cells growing in or on a part of the body where it should not grow (Cambridge)", context: "Practitioners must identify existing tumors, compare them with prior exams, identify new tumors, and evaluate overall disease evolution. [1; p. 2]", translation: "Практикующие врачи должны идентифицировать существующие опухоли, сравнивать их с предыдущими исследованиями, выявлять новые опухоли и оценивать общую эволюцию заболевания." },
    { key: "lesion", termTranslation: "поражение", definition: "An area of damaged tissue in the body (Cambridge)", context: "Fig. 1 illustrates the complexity of the process by representing a longitudinal exam with multiple lesions. [1; p. 2]", translation: "Рис. 1 иллюстрирует сложность процесса, представляя продольное исследование с множественными поражениями." },
    { key: "liver", termTranslation: "печень", definition: "A large organ in the body that cleans the blood and produces bile (Cambridge)", context: "Assessing cancer progression in liver CT scans is a clinical challenge, requiring a comparison of scans at different times for the same patient. [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему, требующую сравнения сканов, сделанных в разное время для одного и того же пациента." },
    { key: "pathological", termTranslation: "патологический", definition: "Relating to pathology (= the study of disease) (Cambridge)", context: "Indeed, longitudinal liver examinations can undergo different non-pathological and pathological changes due to non-rigid deformations, the appearance or disappearance of pathologies, and other variations. [1; p. 1]", translation: "Действительно, продольные исследования печени могут претерпевать различные непатологические и патологические изменения из-за нежёстких деформаций, появления или исчезновения патологий и других вариаций." },
    { key: "disease", termTranslation: "заболевание", definition: "An illness that affects a person, animal, or plant (Cambridge)", context: "Practitioners must identify existing tumors, compare them with prior exams, identify new tumors, and evaluate overall disease evolution. [1; p. 2]", translation: "Практикующие врачи должны идентифицировать существующие опухоли, сравнивать их с предыдущими исследованиями, выявлять новые опухоли и оценивать общую эволюцию заболевания." },
    { key: "burden", termTranslation: "нагрузка", definition: "The total amount or mass of something, especially a disease (Medical Dictionary)", context: "Our experimental results support our claims by showing that our method is better than other registration techniques by providing a smoother deformation while preserving the tumor burden within the volume. [1; p. 1]", translation: "Наши экспериментальные результаты подтверждают наши утверждения, показывая, что наш метод лучше других методов регистрации, обеспечивая более гладкую деформацию при сохранении опухолевой нагрузки в объеме." },
    { key: "dataset", termTranslation: "набор данных", definition: "A collection of data that is organized for analysis (Cambridge)", context: "Our dataset includes 772 pairs of longitudinal liver examinations from 337 patients. [1; p. 6]", translation: "Наш набор данных включает 772 пары продольных исследований печени от 337 пациентов." },
    { key: "architecture", termTranslation: "архитектура", definition: "The structure of a neural network model (Machine Learning Glossary)", context: "The VoxelMorph architecture [1] has been widely employed. [1; p. 3]", translation: "Архитектура VoxelMorph [1] широко использовалась." },
    { key: "cancer", termTranslation: "рак", definition: "A serious disease that is caused when cells in the body grow in a way that is uncontrolled and not normal (Cambridge)", context: "Assessing cancer progression in liver CT scans is a clinical challenge, requiring a comparison of scans at different times for the same patient. [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему, требующую сравнения сканов, сделанных в разное время для одного и того же пациента." },
    { key: "complexity", termTranslation: "сложность", definition: "The state of having many interconnected parts and being difficult to understand (Cambridge)", context: "Fig. 1 illustrates the complexity of the process by representing a longitudinal exam with multiple lesions. [1; p. 2]", translation: "Рис. 1 иллюстрирует сложность процесса, представляя продольное исследование с множественными поражениями." },
    { key: "metric", termTranslation: "метрика", definition: "A standard of measurement (Cambridge)", context: "For tumor-related metrics, evaluation is done on the clinical dataset of 20 patients with 30 annotated tumor masks. [1; p. 7]", translation: "Для метрик, связанных с опухолью, оценка проводится на клиническом наборе данных из 20 пациентов с 30 аннотированными масками опухолей." },
    { key: "validation", termTranslation: "валидация", definition: "The process of checking that something is correct or acceptable (Cambridge)", context: "Three-fold cross-validation experiments (on NVIDIA T4 GPUs) were conducted with an Adam optimizer until convergence and with α = 1, β = 0.8, γ = 1 and μ = 0.4. [1; p. 7]", translation: "Были проведены эксперименты с трехкратной перекрестной валидацией (на GPU NVIDIA T4) с оптимизатором Adam до сходимости и с α = 1, β = 0.8, γ = 1 и μ = 0.4." },
    { key: "inference", termTranslation: "инференс", definition: "The process of using a trained model to make predictions (Machine Learning Glossary)", context: "During inference, the predicted displacement fields (forward direction) are used to compute aligned versions of A and S_A for the moving image and its segmentation. [1; p. 5]", translation: "Во время инференса предсказанные поля смещений (прямое направление) используются для вычисления выровненных версий A и S_A для движущегося изображения и его сегментации." },
    { key: "voxel", termTranslation: "воксель", definition: "A unit of volume in a 3D image, analogous to a pixel in 2D (Medical Imaging Glossary)", context: "Each component of φ_AB' is a three-dimensional vector indicating the displacement of a specific voxel. [1; p. 4]", translation: "Каждый компонент φ_AB' представляет собой трехмерный вектор, указывающий смещение конкретного вокселя." },
    { key: "vector", termTranslation: "вектор", definition: "A quantity having direction as well as magnitude (Cambridge)", context: "Each component of φ_AB' is a three-dimensional vector indicating the displacement of a specific voxel. [1; p. 4]", translation: "Каждый компонент φ_AB' представляет собой трехмерный вектор, указывающий смещение конкретного вокселя." },
    { key: "field", termTranslation: "поле", definition: "A region or space in which a particular effect is present (Cambridge)", context: "The network predicts a displacement field to align the moving image with the fixed image. [1; p. 2]", translation: "Сеть предсказывает поле смещений, чтобы выровнять движущееся изображение с фиксированным." },
    { key: "framework", termTranslation: "структура", definition: "A basic structure underlying a system, concept, or text (Oxford)", context: "Our main contribution is to propose a registration framework that aligns longitudinal images based only on geometric and anatomical information from liver segmentation, smoothly extrapolating the displacement field within the liver. [1; p. 3]", translation: "Наш основной вклад — предложить структуру регистрации, которая выравнивает продольные изображения, основываясь только на геометрической и анатомической информации из сегментации печени, плавно экстраполируя поле смещений внутри печени." },
    { key: "optimizer", termTranslation: "оптимизатор", definition: "An algorithm that adjusts parameters to minimize a loss function (Machine Learning Glossary)", context: "Three-fold cross-validation experiments (on NVIDIA T4 GPUs) were conducted with an Adam optimizer until convergence and with α = 1, β = 0.8, γ = 1 and μ = 0.4. [1; p. 7]", translation: "Были проведены эксперименты с трехкратной перекрестной валидацией (на GPU NVIDIA T4) с оптимизатором Adam до сходимости и с α = 1, β = 0.8, γ = 1 и μ = 0.4." },
    { key: "annotated", termTranslation: "аннотировал", definition: "To add notes or comments to a text or image (Cambridge)", context: "A radiologist manually annotated the tumor masks of this dataset. [1; p. 6]", translation: "Радиолог вручную аннотировал маски опухолей этого набора данных." },
    { key: "radiologist", termTranslation: "радиолог", definition: "A doctor who specializes in examining the body using radiation (Cambridge)", context: "A radiologist manually annotated the tumor masks of this dataset. [1; p. 6]", translation: "Радиолог вручную аннотировал маски опухолей этого набора данных." },
    { key: "clinical", termTranslation: "клинический", definition: "Relating to the examination and treatment of patients (Cambridge)", context: "Assessing cancer progression in liver CT scans is a clinical challenge, requiring a comparison of scans at different times for the same patient. [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему, требующую сравнения сканов, сделанных в разное время для одного и того же пациента." },
    { key: "pre-processing", termTranslation: "предварительная обработка", definition: "The process of preparing data for analysis (Cambridge)", context: "A and B are affinely aligned during a pre-processing step. [1; p. 4]", translation: "A и B аффинно выровнены на этапе предварительной обработки." },
    { key: "constraint", termTranslation: "ограничение", definition: "Something that controls what you do by keeping you within particular limits (Cambridge)", context: "To ensure effective registration, it is necessary to impose a set of constraints: [1; p. 4]", translation: "Для обеспечения эффективной регистрации необходимо наложить набор ограничений:" },
    { key: "smoothness", termTranslation: "гладкость", definition: "The quality of having a surface or edge that is even and not rough (Cambridge)", context: "This first classical constraint penalizes the norm of the derivatives of the displacement field to ensure its local smoothness. [1; p. 4]", translation: "Это первое классическое ограничение штрафует норму производных поля смещений, чтобы обеспечить его локальную гладкость." },
    { key: "penalizes", termTranslation: "штрафует", definition: "To impose a penalty on; to punish (Cambridge)", context: "This first classical constraint penalizes the norm of the derivatives of the displacement field to ensure its local smoothness. [1; p. 4]", translation: "Это первое классическое ограничение штрафует норму производных поля смещений, чтобы обеспечить его локальную гладкость." },
    { key: "invertible", termTranslation: "обратимый", definition: "Capable of being inverted or turned upside down (Cambridge)", context: "The inverse consistency constraint L_inv, detailed in Eq. 4, ensures that the predicted displacement fields are invertible and inversely consistent. [1; p. 5]", translation: "Ограничение обратной согласованности L_inv, подробно описанное в уравнении 4, гарантирует, что предсказанные поля смещений являются обратимыми и обратно согласованными." },
    { key: "diffeomorphic", termTranslation: "диффеоморфный", definition: "Relating to a transformation that is smooth and invertible, meaning it can be reversed smoothly (Mathematics)", context: "We propose to extend our approach by introducing a two-step incremental cyclic diffeomorphic registration process (Fig. 3). [1; p. 5]", translation: "Мы предлагаем расширить наш подход, введя двухэтапный инкрементальный циклический диффеоморфный процесс регистрации (Рис. 3)." },
    { key: "cyclic", termTranslation: "циклический", definition: "Relating to or happening in a cycle (Cambridge)", context: "In response, inspired by [22], we favor a cyclic method over a bidirectional one to compute the displacement fields. [1; p. 5]", translation: "В ответ, вдохновленные [22], мы предпочитаем циклический метод двунаправленному для вычисления полей смещений." },
    { key: "bidirectional", termTranslation: "двунаправленный", definition: "Going in two directions or having two parts that go in opposite directions (Cambridge)", context: "In response, inspired by [22], we favor a cyclic method over a bidirectional one to compute the displacement fields. [1; p. 5]", translation: "В ответ, вдохновленные [22], мы предпочитаем циклический метод двунаправленному для вычисления полей смещений." },
    { key: "longitudinal", termTranslation: "продольный", definition: "Relating to a study in which the same subjects are studied over a period of time (Cambridge)", context: "In longitudinal studies, variations such as patient movements, positioning, and organ displacement are common. [1; p. 2]", translation: "В продольных исследованиях обычны такие вариации, как движения пациента, позиционирование и смещение органов." },
    { key: "similarity", termTranslation: "сходство", definition: "The state of being similar; likeness (Cambridge)", context: "We evaluate our method performance against different registration frameworks: Nifty Reg [26] (cubic B-splines); VoxelMorph under two configurations: 1) trained on images and segmentations with a loss based on image similarity (NCC) and segmentation similarity (DSC), and 2) on segmentations only. [1; p. 7]", translation: "Мы оцениваем производительность нашего метода по сравнению с различными фреймворками регистрации: Nifty Reg [26] (кубические B-сплайны); VoxelMorph в двух конфигурациях: 1) обучен на изображениях и сегментациях с функцией потерь на основе сходства изображений (NCC) и сходства сегментаций (DSC), и 2) только на сегментациях." },
    { key: "non-rigid", termTranslation: "нежёсткий", definition: "Not rigid; capable of being deformed (Cambridge)", context: "Moreover, being a non-rigid organ, the liver presents additional complexities with recurring changes like large deformations due to stomach pressure, alterations in pathology size (cancerous or not), increased fat content, changes in vessel size, and bile duct dilation. [1; p. 2]", translation: "Более того, будучи нежёстким органом, печень представляет дополнительные сложности с повторяющимися изменениями, такими как большие деформации из-за давления желудка, изменения размера патологии (раковой или нет), увеличение содержания жира, изменения размера сосудов и расширение желчных протоков." },
    { key: "spatial", termTranslation: "пространственный", definition: "Relating to the position, area, and size of things (Cambridge)", context: "It predicts a displacement field coupled with a differentiable spatial transformation layer (STN) [21] to apply transformations. [1; p. 3]", translation: "Она предсказывает поле смещений в паре с дифференцируемым слоем пространственных преобразований (STN) [21] для применения трансформаций." },
    { key: "anatomical", termTranslation: "анатомический", definition: "Relating to the structure of the body (Cambridge)", context: "This work proposes a registration method based only on geometrical and anatomical information from liver segmentation, aimed at aligning longitudinal liver images for aided diagnosis. [1; p. 1]", translation: "В данной работе предлагается метод регистрации, основанный только на геометрической и анатомической информации из сегментации печени, направленный на выравнивание продольных изображений печени для вспомогательной диагностики." },
    { key: "intrinsic", termTranslation: "внутренний", definition: "Being an extremely important and basic characteristic of a person or thing (Cambridge)", context: "In such cases, existing registration approaches, mainly based on intrinsic features may distort tumor regions, biasing the tumor progress evaluation step and the corresponding diagnosis. [1; p. 1]", translation: "В таких случаях существующие подходы к регистрации, в основном основанные на внутренних признаках, могут искажать области опухоли, смещая этап оценки прогрессирования опухоли и соответствующий диагноз." },
    { key: "evaluation", termTranslation: "оценка", definition: "The process of judging or calculating the quality, importance, amount, or value of something (Cambridge)", context: "For tumor-related metrics, evaluation is done on the clinical dataset of 20 patients with 30 annotated tumor masks. [1; p. 7]", translation: "Для метрик, связанных с опухолью, оценка проводится на клиническом наборе данных из 20 пациентов с 30 аннотированными масками опухолей." },
    { key: "transformation", termTranslation: "преобразование", definition: "A change in the form or nature of something (Cambridge)", context: "It predicts a displacement field coupled with a differentiable spatial transformation layer (STN) [21] to apply transformations. [1; p. 3]", translation: "Она предсказывает поле смещений в паре с дифференцируемым слоем пространственных преобразований (STN) [21] для применения трансформаций." },
    { key: "consistency", termTranslation: "согласованность", definition: "The quality of always behaving or happening in a similar way (Cambridge)", context: "The inverse consistency constraint L_inv, detailed in Eq. 4, ensures that the predicted displacement fields are invertible and inversely consistent. [1; p. 5]", translation: "Ограничение обратной согласованности L_inv, подробно описанное в уравнении 4, гарантирует, что предсказанные поля смещений являются обратимыми и обратно согласованными." },
    { key: "assessing", termTranslation: "оценка", definition: "To judge or decide the amount, value, quality, or importance of something (Cambridge)", context: "Assessing cancer progression in liver CT scans is a clinical challenge, requiring a comparison of scans at different times for the same patient. [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему, требующую сравнения сканов, сделанных в разное время для одного и того же пациента." },
    { key: "challenge", termTranslation: "проблема", definition: "Something that needs great mental or physical effort in order to be done successfully (Cambridge)", context: "Assessing cancer progression in liver CT scans is a clinical challenge, requiring a comparison of scans at different times for the same patient. [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему, требующую сравнения сканов, сделанных в разное время для одного и того же пациента." },
    { key: "compare", termTranslation: "сравнивать", definition: "To examine or look for the difference between two or more things (Cambridge)", context: "In the healthcare workflow, practitioners compare scans taken at different times for the same patient. [1; p. 1]", translation: "В рабочем процессе здравоохранения практикующие врачи сравнивают снимки, сделанные в разное время для одного и того же пациента." }
  ];

    // --- ЛОГИКА ---
    let studyQueue = [];
    let knownCount = 0;
    let currentCard = null;
    let isFlipped = false;

    const dragWrapper = document.getElementById('dragWrapper');
    const card = document.getElementById('card');
    const keyWordEl = document.getElementById('keyWord');
    const definitionEl = document.getElementById('definition');
    const translationEl = document.getElementById('translation');
    const contextEl = document.getElementById('context');
    const termTranslationEl = document.getElementById('termTranslation'); // Новый элемент
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const completionScreen = document.getElementById('completionScreen');
    const controls = document.getElementById('controls');
    const overlayKnow = document.getElementById('overlayKnow');
    const overlayDontKnow = document.getElementById('overlayDontKnow');

    function initSession() {
      studyQueue = [...glossaryData];
      for (let i = studyQueue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [studyQueue[i], studyQueue[j]] = [studyQueue[j], studyQueue[i]];
      }
      knownCount = 0;
      completionScreen.style.display = 'none';
      controls.style.display = 'flex';
      updateProgress();
      loadNextCard();
    }

    function loadNextCard() {
      if (studyQueue.length === 0) {
        completionScreen.style.display = 'flex';
        controls.style.display = 'none';
        return;
      }

      card.style.transition = 'none';
      card.classList.remove('is-flipped');
      isFlipped = false;
      
      dragWrapper.style.transition = 'none';
      dragWrapper.style.transform = 'translate(0px, 0px) rotate(0deg)';
      overlayKnow.style.opacity = 0;
      overlayDontKnow.style.opacity = 0;

      currentCard = studyQueue[0];

      setTimeout(() => {
        keyWordEl.textContent = currentCard.key;
        definitionEl.textContent = currentCard.definition;
        contextEl.textContent = currentCard.context;
        // Устанавливаем перевод термина
        termTranslationEl.textContent = "Перевод: " + currentCard.termTranslation; 
        translationEl.textContent = currentCard.translation;
        
        card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)';
        dragWrapper.style.transition = 'transform 0.3s ease';
      }, 50);
    }

    function updateProgress() {
      const total = glossaryData.length;
      const percent = (knownCount / total) * 100;
      progressBar.style.width = `${percent}%`;
      progressText.textContent = `${knownCount} / ${total}`;
    }

    function handleKnow() {
      if (studyQueue.length === 0) return;
      studyQueue.shift(); 
      knownCount++;
      updateProgress();
      loadNextCard();
    }

    function handleDontKnow() {
      if (studyQueue.length === 0) return;
      const cardToRepeat = studyQueue.shift();
      studyQueue.push(cardToRepeat);
      loadNextCard();
    }

    let isDragging = false;
    let startX = 0, startY = 0;
    let isTap = true;

    dragWrapper.addEventListener('pointerdown', (e) => {
      if (studyQueue.length === 0) return;
      isDragging = true;
      isTap = true;
      startX = e.clientX;
      startY = e.clientY;
      dragWrapper.style.transition = 'none';
      dragWrapper.setPointerCapture(e.pointerId);
    });

    dragWrapper.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;

      if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
        isTap = false;
      }

      dragWrapper.style.transform = `translate(${deltaX}px, ${deltaY}px) rotate(${deltaX * 0.05}deg)`;

      const opacityKnow = Math.max(0, Math.min(1, deltaX / 100));
      const opacityDontKnow = Math.max(0, Math.min(1, -deltaX / 100));
      overlayKnow.style.opacity = opacityKnow;
      overlayDontKnow.style.opacity = opacityDontKnow;
    });

    dragWrapper.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const deltaX = e.clientX - startX;

      if (isTap) {
        isFlipped = !isFlipped;
        card.classList.toggle('is-flipped');
        dragWrapper.style.transition = 'transform 0.3s ease';
        dragWrapper.style.transform = '';
        return;
      }

      if (deltaX > 80) {
        swipeOut('right');
      } else if (deltaX < -80) {
        swipeOut('left');
      } else {
        dragWrapper.style.transition = 'transform 0.3s ease';
        dragWrapper.style.transform = '';
        overlayKnow.style.opacity = 0;
        overlayDontKnow.style.opacity = 0;
      }
    });

    dragWrapper.addEventListener('pointercancel', () => {
      isDragging = false;
      dragWrapper.style.transition = 'transform 0.3s ease';
      dragWrapper.style.transform = '';
      overlayKnow.style.opacity = 0;
      overlayDontKnow.style.opacity = 0;
    });

    function swipeOut(direction) {
      const width = window.innerWidth;
      const deltaX = direction === 'right' ? width : -width;
      
      dragWrapper.style.transition = 'transform 0.3s ease';
      dragWrapper.style.transform = `translate(${deltaX}px, 0px) rotate(${deltaX * 0.05}deg)`;

      setTimeout(() => {
        if (direction === 'right') {
          handleKnow();
        } else {
          handleDontKnow();
        }
      }, 300);
    }

    document.getElementById('knowBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (studyQueue.length > 0) swipeOut('right');
    });

    document.getElementById('dontKnowBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (studyQueue.length > 0) swipeOut('left');
    });

    document.getElementById('flipBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (studyQueue.length === 0) return;
      isFlipped = !isFlipped;
      card.classList.toggle('is-flipped');
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      initSession();
    });

    initSession();

  </script>
</body>
</html>
