<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Академический глоссарий</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --primary-color: #4a90e2;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --border-radius: 16px;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* Прогресс-бар */
    .progress-container {
      width: 100%;
      height: 8px;
      background-color: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--success-color);
      transition: width 0.3s ease;
    }
    .progress-text {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: -8px;
    }

    /* Контейнер для карточки */
    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 480px;
      position: relative;
    }

    /* Обертка для свайпа */
    .drag-wrapper {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
      cursor: grab;
      transition: transform 0.3s ease;
      z-index: 2;
    }
    .drag-wrapper:active {
      cursor: grabbing;
    }

    /* Карточка */
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      background-color: var(--card-bg);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Обратная сторона карточки */
    .card-back {
      transform: rotateY(180deg);
      justify-content: flex-start;
      overflow-y: auto;
      text-align: left;
      align-items: flex-start;
      height: 100%;
    }

    .card-front h2 {
      font-size: 28px;
      color: var(--primary-color);
      word-break: break-word;
    }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Стили для текста на обороте */
    .card-back .def-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #999;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .card-back .definition-official {
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
      line-height: 1.4;
      font-size: 15px;
    }

    .card-back .definition-simple {
      font-size: 14px;
      color: #444;
      margin-bottom: 16px;
      line-height: 1.3;
      background: #f0f4f8;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e1e8ed;
    }

    .card-back .context-box {
      background: #f8f9fa; 
      padding: 12px; 
      border-radius: 8px;
      border-left: 4px solid var(--primary-color); 
      margin-top: 8px; 
      width: 100%;
      margin-bottom: 16px;
    }
    .card-back .context-en { 
      font-style: italic; 
      color: #444; 
      font-size: 13px; 
      line-height: 1.4; 
    }

    .card-back .term-translation {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #777;
      text-align: right;
      border-top: 1px solid #e0e0e0;
      padding-top: 6px;
    }

    /* Перевод всего предложения внизу */
    .card-back .translation {
      margin-top: auto;
      font-size: 13px;
      color: #999;
      font-weight: 400;
      font-style: italic;
      padding-top: 16px;
      border-top: 1px dashed #e0e0e0;
      width: 100%;
      text-align: center;
    }

    /* Оверлеи для свайпов */
    .overlay {
      position: absolute;
      top: 20px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 20px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .overlay.know {
      right: 20px;
      color: var(--success-color);
      border: 3px solid var(--success-color);
      background: rgba(46, 204, 113, 0.1);
      transform: rotate(15deg);
    }
    .overlay.dont-know {
      left: 20px;
      color: var(--danger-color);
      border: 3px solid var(--danger-color);
      background: rgba(231, 76, 60, 0.1);
      transform: rotate(-15deg);
    }

    /* Кнопки */
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      padding: 14px 10px;
      border: none;
      border-radius: 12px;
      background-color: white;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active { transform: scale(0.96); }

    button.danger { background-color: var(--danger-color); color: white; flex: 1; }
    button.success { background-color: var(--success-color); color: white; flex: 1; }
    button.neutral { background-color: #ffffff; color: var(--text-muted); flex: 0.8; border: 1px solid #ddd; }

    /* Экран завершения */
    .completion-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(5px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      border-radius: var(--border-radius); z-index: 100; text-align: center; padding: 24px;
      display: none;
    }
    .completion-screen h2 { font-size: 24px; margin-bottom: 16px; color: var(--success-color); }
    .completion-screen p { margin-bottom: 24px; color: var(--text-muted); }
    .completion-screen button {
      background-color: var(--primary-color); color: white; padding: 14px 28px; font-size: 16px; width: auto;
    }

    .card-back::-webkit-scrollbar { width: 4px; }
    .card-back::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 50</div>
    
    <div class="card-container" id="cardContainer">
      <div class="overlay know" id="overlayKnow">ЗНАЮ</div>
      <div class="overlay dont-know" id="overlayDontKnow">НЕ ЗНАЮ</div>
      
      <div class="drag-wrapper" id="dragWrapper">
        <div class="card" id="card">
          <div class="card-front">
            <h2 id="keyWord">Word</h2>
            <p class="hint">Нажмите, чтобы перевернуть</p>
          </div>
          <div class="card-back">
            <div class="def-label">Официальное определение</div>
            <p class="definition-official" id="definitionOfficial"></p>
            
            <div class="def-label">Простыми словами</div>
            <p class="definition-simple" id="definitionSimple"></p>
            
            <div class="def-label">Контекст из статьи</div>
            <div class="context-box">
              <p class="context-en" id="context"></p>
              <p class="term-translation" id="termTranslation"></p> 
            </div>
            
            <p class="translation" id="translation"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="controls" id="controls">
      <button id="dontKnowBtn" class="danger">Не знаю</button>
      <button id="flipBtn" class="neutral">🔄</button>
      <button id="knowBtn" class="success">Знаю</button>
    </div>

    <div class="completion-screen" id="completionScreen">
      <h2>🎉 Отлично!</h2>
      <p>Вы выучили все слова в этой сессии!</p>
      <button id="restartBtn">Начать заново</button>
    </div>
  </div>

  <script>
    // --- ДАННЫЕ ---
    const glossaryData = [
      { key: "registration", termTranslation: "регистрация", definitionOfficial: "The process of putting two or more images into the same position so they can be compared.", definitionSimple: "Совмещение двух картинок, чтобы их можно было сравнить.", context: "This work proposes a registration method based only on geometrical and anatomical information from liver segmentation, aimed at aligning longitudinal liver images for aided diagnosis. [1; p. 1]", translation: "В данной работе предлагается метод регистрации, основанный только на геометрической и анатомической информации из сегментации печени, направленный на выравнивание продольных изображений печени для вспомогательной диагностики." },
      { key: "segmentation", termTranslation: "сегментация", definitionOfficial: "The process of dividing an image into parts.", definitionSimple: "Разделение изображения на отдельные зоны (например, чтобы отделить печень от остального).", context: "This work proposes a registration method based only on geometrical and anatomical information from liver segmentation, aimed at aligning longitudinal liver images for aided diagnosis. [1; p. 1]", translation: "В данной работе предлагается метод регистрации, основанный только на геометрической и анатомической информации из сегментации печени, направленный на выравнивание продольных изображений печени для вспомогательной диагностики." },
      { key: "deformation", termTranslation: "деформация", definitionOfficial: "A change in shape or size.", definitionSimple: "Изменение формы или размера.", context: "Indeed, longitudinal liver examinations can undergo different non-pathological and pathological changes due to non-rigid deformations... [1; p. 1]", translation: "Действительно, продольные исследования печени могут претерпевать различные изменения из-за нежёстких деформаций..." },
      { key: "displacement", termTranslation: "смещение", definitionOfficial: "A movement from the original position.", definitionSimple: "Сдвиг, смещение объекта со своего места.", context: "The network predicts a displacement field to align the moving image with the fixed image. [1; p. 2]", translation: "Сеть предсказывает поле смещений, чтобы выровнять движущееся изображение с фиксированным." },
      { key: "alignment", termTranslation: "выравнивание", definitionOfficial: "Arranging things in the correct relative position.", definitionSimple: "Выстраивание объектов в правильном положении друг относительно друга.", context: "Tools performing automatic alignment of CT scans for precise tumor follow-up may reduce radiologists mental burden. [1; p. 2]", translation: "Инструменты, выполняющие автоматическое выравнивание КТ-сканов для точного наблюдения за опухолью, могут снизить умственную нагрузку радиологов." },
      { key: "monitoring", termTranslation: "мониторинг", definitionOfficial: "Watching and checking something over time.", definitionSimple: "Наблюдение за чем-то в течение времени.", context: "This monitoring demands considerable effort as practitioners must recognize previously detected lesions... [1; p. 2]", translation: "Этот мониторинг требует значительных усилий, поскольку практикующие врачи должны распознавать ранее обнаруженные поражения..." },
      { key: "progression", termTranslation: "прогрессирование", definitionOfficial: "The process of developing or getting worse.", definitionSimple: "Развитие болезни, ухудшение состояния.", context: "Assessing cancer progression in liver CT scans is a clinical challenge... [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему..." },
      { key: "evolution", termTranslation: "эволюция", definitionOfficial: "Gradual change or development.", definitionSimple: "Постепенные изменения, развитие.", context: "Practitioners must identify existing tumors, compare them with prior exams... and evaluate overall disease evolution. [1; p. 2]", translation: "Практикующие врачи должны идентифицировать существующие опухоли... и оценивать общую эволюцию заболевания." },
      { key: "diagnosis", termTranslation: "диагноз", definitionOfficial: "A judgment about what illness or problem someone has.", definitionSimple: "Постановка диагноза, определение болезни.", context: "In such cases, existing registration approaches... may distort tumor regions, biasing the tumor progress evaluation step and the corresponding diagnosis. [1; p. 1]", translation: "В таких случаях существующие подходы к регистрации... могут искажать области опухоли, смещая этап оценки прогрессирования опухоли и соответствующий диагноз." },
      { key: "tumor", termTranslation: "опухоль", definitionOfficial: "An abnormal mass of cells that grows where it should not.", definitionSimple: "Опухоль, новообразование.", context: "Practitioners must identify existing tumors, compare them with prior exams, identify new tumors... [1; p. 2]", translation: "Практикующие врачи должны идентифицировать существующие опухоли, сравнивать их с предыдущими исследованиями, выявлять новые опухоли..." },
      { key: "lesion", termTranslation: "поражение", definitionOfficial: "An area of damaged tissue.", definitionSimple: "Пораженная область тканей (например, рана или опухоль).", context: "Fig. 1 illustrates the complexity of the process by representing a longitudinal exam with multiple lesions. [1; p. 2]", translation: "Рис. 1 иллюстрирует сложность процесса, представляя продольное исследование с множественными поражениями." },
      { key: "liver", termTranslation: "печень", definitionOfficial: "A large organ that cleans the blood and produces bile.", definitionSimple: "Печень (орган).", context: "Assessing cancer progression in liver CT scans is a clinical challenge... [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему..." },
      { key: "pathological", termTranslation: "патологический", definitionOfficial: "Relating to disease.", definitionSimple: "Патологический, связанный с болезнью.", context: "Indeed, longitudinal liver examinations can undergo different non-pathological and pathological changes... [1; p. 1]", translation: "Действительно, продольные исследования печени могут претерпевать различные непатологические и патологические изменения..." },
      { key: "disease", termTranslation: "заболевание", definitionOfficial: "An illness.", definitionSimple: "Болезнь, заболевание.", context: "Practitioners must identify existing tumors... and evaluate overall disease evolution. [1; p. 2]", translation: "Практикующие врачи должны идентифицировать существующие опухоли... и оценивать общую эволюцию заболевания." },
      { key: "burden", termTranslation: "нагрузка", definitionOfficial: "The total amount of disease in the body.", definitionSimple: "Общая масса/объем болезни в организме (опухолевая нагрузка).", context: "...providing a smoother deformation while preserving the tumor burden within the volume. [1; p. 1]", translation: "...обеспечивая более гладкую деформацию при сохранении опухолевой нагрузки в объеме." },
      { key: "dataset", termTranslation: "набор данных", definitionOfficial: "An organized collection of data.", definitionSimple: "Набор данных для обучения или анализа.", context: "Our dataset includes 772 pairs of longitudinal liver examinations from 337 patients. [1; p. 6]", translation: "Наш набор данных включает 772 пары продольных исследований печени от 337 пациентов." },
      { key: "architecture", termTranslation: "архитектура", definitionOfficial: "The structure of a model or network.", definitionSimple: "Архитектура (строение) нейросети.", context: "The VoxelMorph architecture [1] has been widely employed. [1; p. 3]", translation: "Архитектура VoxelMorph [1] широко использовалась." },
      { key: "cancer", termTranslation: "рак", definitionOfficial: "A disease in which cells grow uncontrollably.", definitionSimple: "Рак (болезнь).", context: "Assessing cancer progression in liver CT scans is a clinical challenge... [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему..." },
      { key: "complexity", termTranslation: "сложность", definitionOfficial: "The state of having many parts and being difficult to understand.", definitionSimple: "Сложность, запутанность.", context: "Fig. 1 illustrates the complexity of the process by representing a longitudinal exam with multiple lesions. [1; p. 2]", translation: "Рис. 1 иллюстрирует сложность процесса, представляя продольное исследование с множественными поражениями." },
      { key: "metric", termTranslation: "метрика", definitionOfficial: "A standard used for measuring.", definitionSimple: "Метрика, показатель для оценки чего-либо.", context: "For tumor-related metrics, evaluation is done on the clinical dataset of 20 patients... [1; p. 7]", translation: "Для метрик, связанных с опухолью, оценка проводится на клиническом наборе данных из 20 пациентов..." },
      { key: "validation", termTranslation: "валидация", definitionOfficial: "The process of checking that something is correct.", definitionSimple: "Проверка правильности (валидация).", context: "Three-fold cross-validation experiments (on NVIDIA T4 GPUs) were conducted... [1; p. 7]", translation: "Были проведены эксперименты с трехкратной перекрестной валидацией (на GPU NVIDIA T4)..." },
      { key: "inference", termTranslation: "инференс", definitionOfficial: "Using a trained model to make predictions.", definitionSimple: "Инференс — применение уже обученной модели.", context: "During inference, the predicted displacement fields... are used to compute aligned versions of A and S_A... [1; p. 5]", translation: "Во время инференса предсказанные поля смещений... используются для вычисления выровненных версий A и S_A..." },
      { key: "voxel", termTranslation: "воксель", definitionOfficial: "A unit of volume in a 3D image, like a 3D pixel.", definitionSimple: "Воксель — 3D-пиксель.", context: "Each component of φ_AB' is a three-dimensional vector indicating the displacement of a specific voxel. [1; p. 4]", translation: "Каждый компонент φ_AB' представляет собой трехмерный вектор, указывающий смещение конкретного вокселя." },
      { key: "vector", termTranslation: "вектор", definitionOfficial: "A quantity with direction and size.", definitionSimple: "Вектор (направление и величина).", context: "Each component of φ_AB' is a three-dimensional vector indicating the displacement of a specific voxel. [1; p. 4]", translation: "Каждый компонент φ_AB' представляет собой трехмерный вектор, указывающий смещение конкретного вокселя." },
      { key: "field", termTranslation: "поле", definitionOfficial: "A region or space where an effect exists; here, a map of displacements.", definitionSimple: "Поле (в данном случае — карта смещений).", context: "The network predicts a displacement field to align the moving image with the fixed image. [1; p. 2]", translation: "Сеть предсказывает поле смещений, чтобы выровнять движущееся изображение с фиксированным." },
      { key: "framework", termTranslation: "структура", definitionOfficial: "A basic structure for a system or method.", definitionSimple: "Фреймворк, базовая структура метода.", context: "Our main contribution is to propose a registration framework... [1; p. 3]", translation: "Наш основной вклад — предложить структуру регистрации..." },
      { key: "optimizer", termTranslation: "оптимизатор", definitionOfficial: "An algorithm that adjusts model parameters to reduce error.", definitionSimple: "Оптимизатор (алгоритм, улучшающий модель).", context: "Three-fold cross-validation experiments... were conducted with an Adam optimizer until convergence... [1; p. 7]", translation: "Были проведены эксперименты... с оптимизатором Adam до сходимости..." },
      { key: "annotated", termTranslation: "аннотировал", definitionOfficial: "Marked with notes or labels.", definitionSimple: "Аннотированный, размеченный.", context: "A radiologist manually annotated the tumor masks of this dataset. [1; p. 6]", translation: "Радиолог вручную аннотировал маски опухолей этого набора данных." },
      { key: "radiologist", termTranslation: "радиолог", definitionOfficial: "A doctor who examines medical images.", definitionSimple: "Радиолог (врач, работающий со снимками).", context: "A radiologist manually annotated the tumor masks of this dataset. [1; p. 6]", translation: "Радиолог вручную аннотировал маски опухолей этого набора данных." },
      { key: "clinical", termTranslation: "клинический", definitionOfficial: "Relating to the examination and treatment of patients.", definitionSimple: "Клинический (связанный с лечением пациентов).", context: "Assessing cancer progression in liver CT scans is a clinical challenge... [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему..." },
      { key: "pre-processing", termTranslation: "предварительная обработка", definitionOfficial: "Preparing data before the main processing.", definitionSimple: "Предварительная обработка данных.", context: "A and B are affinely aligned during a pre-processing step. [1; p. 4]", translation: "A и B аффинно выровнены на этапе предварительной обработки." },
      { key: "constraint", termTranslation: "ограничение", definitionOfficial: "A rule or limit.", definitionSimple: "Ограничение (правило, рамки).", context: "To ensure effective registration, it is necessary to impose a set of constraints: [1; p. 4]", translation: "Для обеспечения эффективной регистрации необходимо наложить набор ограничений:" },
      { key: "smoothness", termTranslation: "гладкость", definitionOfficial: "The quality of being even and regular.", definitionSimple: "Гладкость (отсутствие резких скачков).", context: "This first classical constraint penalizes the norm of the derivatives... to ensure its local smoothness. [1; p. 4]", translation: "Это первое классическое ограничение штрафует норму производных... чтобы обеспечить его локальную гладкость." },
      { key: "penalizes", termTranslation: "штрафует", definitionOfficial: "Adds a cost or punishment for something.", definitionSimple: "Штрафует (накладывает взыскание за ошибку).", context: "This first classical constraint penalizes the norm of the derivatives... [1; p. 4]", translation: "Это первое классическое ограничение штрафует норму производных..." },
      { key: "invertible", termTranslation: "обратимый", definitionOfficial: "Able to be reversed.", definitionSimple: "Обратимый (можно отменить/вернуть назад).", context: "...ensures that the predicted displacement fields are invertible and inversely consistent. [1; p. 5]", translation: "...гарантирует, что предсказанные поля смещений являются обратимыми и обратно согласованными." },
      { key: "diffeomorphic", termTranslation: "диффеоморфный", definitionOfficial: "Smooth and invertible, so it can be reversed smoothly.", definitionSimple: "Диффеоморфный (гладкое и обратимое преобразование).", context: "We propose to extend our approach by introducing a two-step incremental cyclic diffeomorphic registration process... [1; p. 5]", translation: "Мы предлагаем расширить наш подход, введя двухэтапный инкрементальный циклический диффеоморфный процесс регистрации..." },
      { key: "cyclic", termTranslation: "циклический", definitionOfficial: "Happening in a cycle.", definitionSimple: "Циклический (идущий по кругу).", context: "...we favor a cyclic method over a bidirectional one to compute the displacement fields. [1; p. 5]", translation: "...мы предпочитаем циклический метод двунаправленному для вычисления полей смещений." },
      { key: "bidirectional", termTranslation: "двунаправленный", definitionOfficial: "Going in two directions.", definitionSimple: "Двунаправленный (идущий в две стороны).", context: "...we favor a cyclic method over a bidirectional one to compute the displacement fields. [1; p. 5]", translation: "...мы предпочитаем циклический метод двунаправленному для вычисления полей смещений." },
      { key: "longitudinal", termTranslation: "продольный", definitionOfficial: "Relating to the same subjects studied over time.", definitionSimple: "Продольный (исследование одного пациента с течением времени).", context: "In longitudinal studies, variations such as patient movements... are common. [1; p. 2]", translation: "В продольных исследованиях обычны такие вариации, как движения пациента..." },
      { key: "similarity", termTranslation: "сходство", definitionOfficial: "The state of being alike.", definitionSimple: "Сходство, похожесть.", context: "...trained on images and segmentations with a loss based on image similarity (NCC) and segmentation similarity (DSC)... [1; p. 7]", translation: "...обучен на изображениях и сегментациях с функцией потерь на основе сходства изображений (NCC) и сходства сегментаций (DSC)..." },
      { key: "non-rigid", termTranslation: "нежёсткий", definitionOfficial: "Not fixed; able to change shape.", definitionSimple: "Нежёсткий (способный менять форму).", context: "Moreover, being a non-rigid organ, the liver presents additional complexities... [1; p. 2]", translation: "Более того, будучи нежёстким органом, печень представляет дополнительные сложности..." },
      { key: "spatial", termTranslation: "пространственный", definitionOfficial: "Relating to position or space.", definitionSimple: "Пространственный (относящийся к пространству).", context: "It predicts a displacement field coupled with a differentiable spatial transformation layer (STN)... [1; p. 3]", translation: "Она предсказывает поле смещений в паре с дифференцируемым слоем пространственных преобразований (STN)..." },
      { key: "anatomical", termTranslation: "анатомический", definitionOfficial: "Relating to the structure of the body.", definitionSimple: "Анатомический (связанный со строением тела).", context: "This work proposes a registration method based only on geometrical and anatomical information... [1; p. 1]", translation: "В данной работе предлагается метод регистрации, основанный только на геометрической и анатомической информации..." },
      { key: "intrinsic", termTranslation: "внутренний", definitionOfficial: "Belonging naturally; internal.", definitionSimple: "Внутренний, присущий самому объекту.", context: "...existing registration approaches, mainly based on intrinsic features may distort tumor regions... [1; p. 1]", translation: "...существующие подходы к регистрации, в основном основанные на внутренних признаках, могут искажать области опухоли..." },
      { key: "evaluation", termTranslation: "оценка", definitionOfficial: "The process of judging quality, value, or amount.", definitionSimple: "Оценка (проверка качества или результатов).", context: "For tumor-related metrics, evaluation is done on the clinical dataset of 20 patients... [1; p. 7]", translation: "Для метрик, связанных с опухолью, оценка проводится на клиническом наборе данных из 20 пациентов..." },
      { key: "transformation", termTranslation: "преобразование", definitionOfficial: "A change in form or nature.", definitionSimple: "Преобразование, трансформация.", context: "It predicts a displacement field coupled with a differentiable spatial transformation layer (STN)... [1; p. 3]", translation: "Она предсказывает поле смещений в паре с дифференцируемым слоем пространственных преобразований (STN)..." },
      { key: "consistency", termTranslation: "согласованность", definitionOfficial: "Agreement or similar behavior over time.", definitionSimple: "Согласованность (непротиворечивость).", context: "The inverse consistency constraint L_inv... ensures that the predicted displacement fields are invertible and inversely consistent. [1; p. 5]", translation: "Ограничение обратной согласованности L_inv... гарантирует, что предсказанные поля смещений являются обратимыми и обратно согласованными." },
      { key: "assessing", termTranslation: "оценка", definitionOfficial: "Judging or estimating.", definitionSimple: "Оценивание, анализ.", context: "Assessing cancer progression in liver CT scans is a clinical challenge... [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему..." },
      { key: "challenge", termTranslation: "проблема", definitionOfficial: "A difficult problem.", definitionSimple: "Вызов, сложная задача.", context: "Assessing cancer progression in liver CT scans is a clinical challenge... [1; p. 1]", translation: "Оценка прогрессирования рака на КТ-сканах печени представляет собой клиническую проблему..." },
      { key: "compare", termTranslation: "сравнивать", definitionOfficial: "To examine differences between things.", definitionSimple: "Сравнивать.", context: "In the healthcare workflow, practitioners compare scans taken at different times for the same patient. [1; p. 1]", translation: "В рабочем процессе здравоохранения практикующие врачи сравнивают снимки, сделанные в разное время для одного и того же пациента." }
    ];

    // --- ЛОГИКА ---
    let studyQueue = [];
    let knownCount = 0;
    let currentCard = null;
    let isFlipped = false;

    const dragWrapper = document.getElementById('dragWrapper');
    const card = document.getElementById('card');
    const keyWordEl = document.getElementById('keyWord');
    const defOfficialEl = document.getElementById('definitionOfficial');
    const defSimpleEl = document.getElementById('definitionSimple');
    const translationEl = document.getElementById('translation');
    const contextEl = document.getElementById('context');
    const termTranslationEl = document.getElementById('termTranslation');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const completionScreen = document.getElementById('completionScreen');
    const controls = document.getElementById('controls');
    const overlayKnow = document.getElementById('overlayKnow');
    const overlayDontKnow = document.getElementById('overlayDontKnow');

    function initSession() {
      studyQueue = [...glossaryData];
      for (let i = studyQueue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [studyQueue[i], studyQueue[j]] = [studyQueue[j], studyQueue[i]];
      }
      knownCount = 0;
      completionScreen.style.display = 'none';
      controls.style.display = 'flex';
      updateProgress();
      loadNextCard();
    }

    function loadNextCard() {
      if (studyQueue.length === 0) {
        completionScreen.style.display = 'flex';
        controls.style.display = 'none';
        return;
      }

      card.style.transition = 'none';
      card.classList.remove('is-flipped');
      isFlipped = false;
      
      dragWrapper.style.transition = 'none';
      dragWrapper.style.transform = 'translate(0px, 0px) rotate(0deg)';
      overlayKnow.style.opacity = 0;
      overlayDontKnow.style.opacity = 0;

      currentCard = studyQueue[0];

      setTimeout(() => {
        keyWordEl.textContent = currentCard.key;
        defOfficialEl.textContent = currentCard.definitionOfficial;
        defSimpleEl.textContent = currentCard.definitionSimple;
        contextEl.textContent = currentCard.context;
        termTranslationEl.textContent = "Перевод: " + currentCard.termTranslation; 
        translationEl.textContent = currentCard.translation;
        
        card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)';
        dragWrapper.style.transition = 'transform 0.3s ease';
      }, 50);
    }

    function updateProgress() {
      const total = glossaryData.length;
      const percent = (knownCount / total) * 100;
      progressBar.style.width = `${percent}%`;
      progressText.textContent = `${knownCount} / ${total}`;
    }

    function handleKnow() {
      if (studyQueue.length === 0) return;
      studyQueue.shift(); 
      knownCount++;
      updateProgress();
      loadNextCard();
    }

    function handleDontKnow() {
      if (studyQueue.length === 0) return;
      const cardToRepeat = studyQueue.shift();
      studyQueue.push(cardToRepeat);
      loadNextCard();
    }

    let isDragging = false;
    let startX = 0, startY = 0;
    let isTap = true;

    dragWrapper.addEventListener('pointerdown', (e) => {
      if (studyQueue.length === 0) return;
      isDragging = true;
      isTap = true;
      startX = e.clientX;
      startY = e.clientY;
      dragWrapper.style.transition = 'none';
      dragWrapper.setPointerCapture(e.pointerId);
    });

    dragWrapper.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;

      if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
        isTap = false;
      }

      dragWrapper.style.transform = `translate(${deltaX}px, ${deltaY}px) rotate(${deltaX * 0.05}deg)`;

      const opacityKnow = Math.max(0, Math.min(1, deltaX / 100));
      const opacityDontKnow = Math.max(0, Math.min(1, -deltaX / 100));
      overlayKnow.style.opacity = opacityKnow;
      overlayDontKnow.style.opacity = opacityDontKnow;
    });

    dragWrapper.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const deltaX = e.clientX - startX;

      if (isTap) {
        isFlipped = !isFlipped;
        card.classList.toggle('is-flipped');
        dragWrapper.style.transition = 'transform 0.3s ease';
        dragWrapper.style.transform = '';
        return;
      }

      if (deltaX > 80) {
        swipeOut('right');
      } else if (deltaX < -80) {
        swipeOut('left');
      } else {
        dragWrapper.style.transition = 'transform 0.3s ease';
        dragWrapper.style.transform = '';
        overlayKnow.style.opacity = 0;
        overlayDontKnow.style.opacity = 0;
      }
    });

    dragWrapper.addEventListener('pointercancel', () => {
      isDragging = false;
      dragWrapper.style.transition = 'transform 0.3s ease';
      dragWrapper.style.transform = '';
      overlayKnow.style.opacity = 0;
      overlayDontKnow.style.opacity = 0;
    });

    function swipeOut(direction) {
      const width = window.innerWidth;
      const deltaX = direction === 'right' ? width : -width;
      
      dragWrapper.style.transition = 'transform 0.3s ease';
      dragWrapper.style.transform = `translate(${deltaX}px, 0px) rotate(${deltaX * 0.05}deg)`;

      setTimeout(() => {
        if (direction === 'right') {
          handleKnow();
        } else {
          handleDontKnow();
        }
      }, 300);
    }

    document.getElementById('knowBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (studyQueue.length > 0) swipeOut('right');
    });

    document.getElementById('dontKnowBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (studyQueue.length > 0) swipeOut('left');
    });

    document.getElementById('flipBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (studyQueue.length === 0) return;
      isFlipped = !isFlipped;
      card.classList.toggle('is-flipped');
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      initSession();
    });

    initSession();

  </script>
</body>
</html>
