<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Академический глоссарий</title>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #666666;
      --primary-color: #4a90e2;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --border-radius: 16px;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* Переключатель вариантов */
    .mode-switch {
      display: flex;
      background: #e4e7eb;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px 8px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: none;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .mode-btn.active {
      background: #ffffff;
      color: var(--primary-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .mode-btn:active { transform: scale(0.97); }

    /* Прогресс-бар */
    .progress-container {
      width: 100%;
      height: 8px;
      background-color: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--success-color);
      transition: width 0.3s ease;
    }
    .progress-text {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: -8px;
    }

    /* Контейнер для карточки */
    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 480px;
      position: relative;
    }

    /* Обертка для свайпа */
    .drag-wrapper {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
      cursor: grab;
      transition: transform 0.3s ease;
      z-index: 2;
    }
    .drag-wrapper:active {
      cursor: grabbing;
    }

    /* Карточка */
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      background-color: var(--card-bg);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Обратная сторона карточки */
    .card-back {
      transform: rotateY(180deg);
      justify-content: flex-start;
      overflow-y: auto;
      text-align: left;
      align-items: flex-start;
      height: 100%;
    }

    .card-front h2 {
      font-size: 28px;
      color: var(--primary-color);
      word-break: break-word;
    }
    .card-front h2.ru {
      font-size: 22px;
      line-height: 1.35;
    }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Английское слово на обороте (режим RU→EN) */
    .card-back .back-key {
      display: none;
      width: 100%;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #eef2f7;
      word-break: break-word;
    }

    /* Стили для текста на обороте */
    .card-back .def-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #999;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .card-back .definition-official {
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
      line-height: 1.4;
      font-size: 15px;
    }

    .card-back .definition-simple {
      font-size: 14px;
      color: #444;
      margin-bottom: 16px;
      line-height: 1.3;
      background: #f0f4f8;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e1e8ed;
    }

    .card-back .context-box {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--primary-color);
      margin-top: 8px;
      width: 100%;
      margin-bottom: 16px;
    }
    .card-back .context-en {
      font-style: italic;
      color: #444;
      font-size: 14px;
      line-height: 1.4;
    }

    .card-back .term-translation {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #777;
      text-align: right;
      border-top: 1px solid #e0e0e0;
      padding-top: 6px;
    }

    /* Перевод предложения внизу */
    .card-back .translation {
      margin-top: auto;
      font-size: 14px;
      color: #777;
      font-weight: 400;
      padding-top: 16px;
      border-top: 1px dashed #e0e0e0;
      width: 100%;
      text-align: left;
    }

    /* Оверлеи для свайпов */
    .overlay {
      position: absolute;
      top: 20px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 20px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .overlay.know {
      right: 20px;
      color: var(--success-color);
      border: 3px solid var(--success-color);
      background: rgba(46, 204, 113, 0.1);
      transform: rotate(15deg);
    }
    .overlay.dont-know {
      left: 20px;
      color: var(--danger-color);
      border: 3px solid var(--danger-color);
      background: rgba(231, 76, 60, 0.1);
      transform: rotate(-15deg);
    }

    /* Кнопки */
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      padding: 14px 10px;
      border: none;
      border-radius: 12px;
      background-color: white;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active { transform: scale(0.96); }

    button.danger { background-color: var(--danger-color); color: white; flex: 1; }
    button.success { background-color: var(--success-color); color: white; flex: 1; }
    button.neutral { background-color: #ffffff; color: var(--text-muted); flex: 0.8; border: 1px solid #ddd; }

    /* Экран завершения */
    .completion-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(5px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      border-radius: var(--border-radius); z-index: 100; text-align: center; padding: 24px;
      display: none;
    }
    .completion-screen h2 { font-size: 24px; margin-bottom: 16px; color: var(--success-color); }
    .completion-screen p { margin-bottom: 24px; color: var(--text-muted); }
    .completion-screen button {
      background-color: var(--primary-color); color: white; padding: 14px 28px; font-size: 16px; width: auto;
    }

    .card-back::-webkit-scrollbar { width: 4px; }
    .card-back::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Переключатель вариантов -->
    <div class="mode-switch" id="modeSwitch">
      <button class="mode-btn active" data-mode="en-ru">🇬🇧 → 🇷🇺</button>
      <button class="mode-btn" data-mode="ru-en">🇷🇺 → 🇬🇧</button>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 50</div>

    <div class="card-container" id="cardContainer">
      <div class="overlay know" id="overlayKnow">ЗНАЮ</div>
      <div class="overlay dont-know" id="overlayDontKnow">НЕ ЗНАЮ</div>

      <div class="drag-wrapper" id="dragWrapper">
        <div class="card" id="card">
          <div class="card-front">
            <h2 id="keyWord">Word</h2>
            <p class="hint">Нажмите, чтобы перевернуть</p>
          </div>
          <div class="card-back">
            <h2 class="back-key" id="backKey"></h2>

            <div class="def-label">Официальное определение</div>
            <p class="definition-official" id="definitionOfficial"></p>

            <div class="def-label">Простыми словами</div>
            <p class="definition-simple" id="definitionSimple"></p>

            <div class="def-label">Простой пример</div>
            <div class="context-box">
              <p class="context-en" id="context"></p>
              <p class="term-translation" id="termTranslation"></p>
            </div>

            <p class="translation" id="translation"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="controls" id="controls">
      <button id="dontKnowBtn" class="danger">Не знаю</button>
      <button id="flipBtn" class="neutral">🔄</button>
      <button id="knowBtn" class="success">Знаю</button>
    </div>

    <div class="completion-screen" id="completionScreen">
      <h2>🎉 Отлично!</h2>
      <p>Вы выучили все слова в этой сессии!</p>
      <button id="restartBtn">Начать заново</button>
    </div>
  </div>

  <script>
    // --- ДАННЫЕ ---
    const glossaryData = [
      { key: "registration", termTranslation: "регистрация", definitionOfficial: "The process of putting two or more images into the same position so they can be compared.", definitionSimple: "Совмещение двух картинок, чтобы их можно было сравнить.", context: "The doctor used a registration method to compare the two liver scans.", translation: "Врач использовал метод регистрации, чтобы сравнить два снимка печени." },
      { key: "segmentation", termTranslation: "сегментация", definitionOfficial: "The process of dividing an image into parts.", definitionSimple: "Разделение изображения на отдельные зоны (например, чтобы отделить печень от остального).", context: "The computer program did a liver segmentation on the medical image.", translation: "Компьютерная программа выполнила сегментацию печени на медицинском снимке." },
      { key: "deformation", termTranslation: "деформация", definitionOfficial: "A change in shape or size.", definitionSimple: "Изменение формы или размера.", context: "The tumor caused a small deformation of the liver tissue.", translation: "Опухоль вызвала небольшую деформацию тканей печени." },
      { key: "displacement", termTranslation: "смещение", definitionOfficial: "A movement from the original position.", definitionSimple: "Сдвиг, смещение объекта со своего места.", context: "The displacement field shows how much each part of the image moved.", translation: "Поле смещений показывает, насколько сдвинулась каждая часть изображения." },
      { key: "alignment", termTranslation: "выравнивание", definitionOfficial: "Arranging things in the correct relative position.", definitionSimple: "Выстраивание объектов в правильном положении друг относительно друга.", context: "Good alignment of the scans helps doctors see the tumor clearly.", translation: "Хорошее выравнивание снимков помогает врачам четко видеть опухоль." },
      { key: "monitoring", termTranslation: "мониторинг", definitionOfficial: "Watching and checking something over time.", definitionSimple: "Наблюдение за чем-то в течение времени.", context: "The patient is under constant monitoring after the surgery.", translation: "Пациент находится под постоянным мониторингом после операции." },
      { key: "progression", termTranslation: "прогрессирование", definitionOfficial: "The process of developing or getting worse.", definitionSimple: "Развитие болезни, ухудшение состояния.", context: "The new medicine slowed down the cancer progression.", translation: "Новое лекарство замедлило прогрессирование рака." },
      { key: "evolution", termTranslation: "эволюция", definitionOfficial: "Gradual change or development.", definitionSimple: "Постепенные изменения, развитие.", context: "The doctor monitored the evolution of the disease over time.", translation: "Врач следил за эволюцией заболевания с течением времени." },

      { key: "tumor", termTranslation: "опухоль", definitionOfficial: "An abnormal mass of cells that grows where it should not.", definitionSimple: "Опухоль, новообразование.", context: "The scan showed that the tumor was getting smaller.", translation: "Сканирование показало, что опухоль уменьшается." },
      { key: "lesion", termTranslation: "поражение", definitionOfficial: "An area of damaged tissue.", definitionSimple: "Пораженная область тканей (например, рана или опухоль).", context: "The doctor found a new lesion on the patient's liver.", translation: "Врач обнаружил новое поражение на печени пациента." },
      { key: "liver", termTranslation: "печень", definitionOfficial: "A large organ that cleans the blood and produces bile.", definitionSimple: "Печень (орган).", context: "The liver is a very important organ in the human body.", translation: "Печень — очень важный орган в организме человека." },
      { key: "pathological", termTranslation: "патологический", definitionOfficial: "Relating to disease.", definitionSimple: "Патологический, связанный с болезнью.", context: "The doctor studied the pathological changes in the tissue.", translation: "Врач изучал патологические изменения в тканях." },
      { key: "disease", termTranslation: "заболевание", definitionOfficial: "An illness.", definitionSimple: "Болезнь, заболевание.", context: "Liver disease can be very dangerous if not treated.", translation: "Заболевание печени может быть очень опасным, если его не лечить." },
      { key: "burden", termTranslation: "нагрузка", definitionOfficial: "The total amount of disease in the body.", definitionSimple: "Общая масса/объем болезни в организме (опухолевая нагрузка).", context: "The treatment helped to reduce the tumor burden.", translation: "Лечение помогло снизить опухолевую нагрузку." },
      { key: "dataset", termTranslation: "набор данных", definitionOfficial: "An organized collection of data.", definitionSimple: "Набор данных для обучения или анализа.", context: "The scientists used a large dataset of medical images.", translation: "Ученые использовали большой набор данных медицинских изображений." },
      { key: "architecture", termTranslation: "архитектура", definitionOfficial: "The structure of a model or network.", definitionSimple: "Архитектура (строение) нейросети.", context: "The team built a new neural network architecture.", translation: "Команда создала новую архитектуру нейросети." },
      { key: "cancer", termTranslation: "рак", definitionOfficial: "A disease in which cells grow uncontrollably.", definitionSimple: "Рак (болезнь).", context: "Early diagnosis is very important for treating cancer.", translation: "Ранний диагноз очень важен для лечения рака." },

      { key: "optimizer", termTranslation: "оптимизатор", definitionOfficial: "An algorithm that adjusts model parameters to reduce error.", definitionSimple: "Оптимизатор (алгоритм, улучшающий модель).", context: "The Adam optimizer helps the model learn faster.", translation: "Оптимизатор Adam помогает модели учиться быстрее." },

      { key: "pre-processing", termTranslation: "предварительная обработка", definitionOfficial: "Preparing data before the main processing.", definitionSimple: "Предварительная обработка данных.", context: "We apply a pre-processing step to clean the data.", translation: "Мы применяем этап предварительной обработки для очистки данных." },

      { key: "smoothness", termTranslation: "гладкость", definitionOfficial: "The quality of being even and regular.", definitionSimple: "Гладкость (отсутствие резких скачков).", context: "The algorithm ensures the smoothness of the final image.", translation: "Алгоритм обеспечивает гладкость итогового изображения." },

      { key: "bidirectional", termTranslation: "двунаправленный", definitionOfficial: "Going in two directions.", definitionSimple: "Двунаправленный (идущий в две стороны).", context: "Bidirectional registration uses two separate paths.", translation: "Двунаправленная регистрация использует два отдельных пути." },
      { key: "longitudinal", termTranslation: "продольный", definitionOfficial: "Relating to the same subjects studied over time.", definitionSimple: "Продольный (исследование одного пациента с течением времени).", context: "A longitudinal study follows patients for many years.", translation: "Продольное исследование наблюдает за пациентами в течение многих лет." },
      { key: "similarity", termTranslation: "сходство", definitionOfficial: "The state of being alike.", definitionSimple: "Сходство, похожесть.", context: "We use a metric to calculate the similarity between images.", translation: "Мы используем метрику для вычисления сходства между изображениями." },
      { key: "non-rigid", termTranslation: "нежёсткий", definitionOfficial: "Not fixed; able to change shape.", definitionSimple: "Нежёсткий (способный менять форму).", context: "The liver is a non-rigid organ, so it can change shape.", translation: "Печень — нежёсткий орган, поэтому она может менять форму." },
      { key: "spatial", termTranslation: "пространственный", definitionOfficial: "Relating to position or space.", definitionSimple: "Пространственный (относящийся к пространству).", context: "The spatial information helps us align the images.", translation: "Пространственная информация помогает нам выравнивать изображения." },
      { key: "anatomical", termTranslation: "анатомический", definitionOfficial: "Relating to the structure of the body.", definitionSimple: "Анатомический (связанный со строением тела).", context: "The method uses anatomical information from the liver.", translation: "Метод использует анатомическую информацию о печени." },
      { key: "intrinsic", termTranslation: "внутренний", definitionOfficial: "Belonging naturally; internal.", definitionSimple: "Внутренний, присущий самому объекту.", context: "The system uses intrinsic features of the image.", translation: "Система использует внутренние признаки изображения." },
      { key: "evaluation", termTranslation: "оценка", definitionOfficial: "The process of judging quality, value, or amount.", definitionSimple: "Оценка (проверка качества или результатов).", context: "The evaluation showed that the method works well.", translation: "Оценка показала, что метод работает хорошо." },
      { key: "transformation", termTranslation: "преобразование", definitionOfficial: "A change in form or nature.", definitionSimple: "Преобразование, трансформация.", context: "The model applies a transformation to the input image.", translation: "Модель применяет преобразование к входному изображению." },
      { key: "consistency", termTranslation: "согласованность", definitionOfficial: "Agreement or similar behavior over time.", definitionSimple: "Согласованность (непротиворечивость).", context: "We need to ensure consistency between the two images.", translation: "Нам нужно обеспечить согласованность между двумя изображениями." },
      { key: "assessing", termTranslation: "оценка", definitionOfficial: "Judging or estimating.", definitionSimple: "Оценивание, анализ.", context: "The doctor is assessing the patient's condition.", translation: "Врач оценивает состояние пациента." },
      { key: "challenge", termTranslation: "проблема", definitionOfficial: "A difficult problem.", definitionSimple: "Вызов, сложная задача.", context: "This task is a big challenge for modern computers.", translation: "Эта задача — большая проблема для современных компьютеров." },
      { key: "compare", termTranslation: "сравнивать", definitionOfficial: "To examine differences between things.", definitionSimple: "Сравнивать.", context: "We need to compare the new results with the old ones.", translation: "Нам нужно сравнить новые результаты со старыми." }
    ];

    // --- ЛОГИКА ---
    let studyQueue = [];
    let knownCount = 0;
    let currentCard = null;
    let isFlipped = false;
    let currentMode = 'en-ru'; // 'en-ru' | 'ru-en'

    const dragWrapper = document.getElementById('dragWrapper');
    const card = document.getElementById('card');
    const keyWordEl = document.getElementById('keyWord');
    const backKeyEl = document.getElementById('backKey');
    const defOfficialEl = document.getElementById('definitionOfficial');
    const defSimpleEl = document.getElementById('definitionSimple');
    const translationEl = document.getElementById('translation');
    const contextEl = document.getElementById('context');
    const termTranslationEl = document.getElementById('termTranslation');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const completionScreen = document.getElementById('completionScreen');
    const controls = document.getElementById('controls');
    const overlayKnow = document.getElementById('overlayKnow');
    const overlayDontKnow = document.getElementById('overlayDontKnow');

    function initSession() {
      studyQueue = [...glossaryData];
      for (let i = studyQueue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [studyQueue[i], studyQueue[j]] = [studyQueue[j], studyQueue[i]];
      }
      knownCount = 0;
      completionScreen.style.display = 'none';
      controls.style.display = 'flex';
      updateProgress();
      loadNextCard();
    }

    function loadNextCard() {
      if (studyQueue.length === 0) {
        completionScreen.style.display = 'flex';
        controls.style.display = 'none';
        return;
      }

      card.style.transition = 'none';
      card.classList.remove('is-flipped');
      isFlipped = false;

      dragWrapper.style.transition = 'none';
      dragWrapper.style.transform = 'translate(0px, 0px) rotate(0deg)';
      overlayKnow.style.opacity = 0;
      overlayDontKnow.style.opacity = 0;

      currentCard = studyQueue[0];

      setTimeout(() => {
        // --- Лицевая сторона зависит от режима ---
        if (currentMode === 'en-ru') {
          keyWordEl.textContent = currentCard.key;
          keyWordEl.classList.remove('ru');
        } else {
          keyWordEl.textContent = currentCard.termTranslation;
          keyWordEl.classList.add('ru');
        }

        // --- Оборотная сторона ---
        if (currentMode === 'ru-en') {
          backKeyEl.textContent = currentCard.key;
          backKeyEl.style.display = 'block';
          termTranslationEl.style.display = 'none';
        } else {
          backKeyEl.style.display = 'none';
          termTranslationEl.style.display = 'block';
          termTranslationEl.textContent = "Перевод: " + currentCard.termTranslation;
        }

        defOfficialEl.textContent = currentCard.definitionOfficial;
        defSimpleEl.textContent = currentCard.definitionSimple;
        contextEl.textContent = currentCard.context;
        translationEl.textContent = currentCard.translation;

        card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)';
        dragWrapper.style.transition = 'transform 0.3s ease';
      }, 50);
    }

    function updateProgress() {
      const total = glossaryData.length;
      const percent = (knownCount / total) * 100;
      progressBar.style.width = `${percent}%`;
      progressText.textContent = `${knownCount} / ${total}`;
    }

    function handleKnow() {
      if (studyQueue.length === 0) return;
      studyQueue.shift();
      knownCount++;
      updateProgress();
      loadNextCard();
    }

    function handleDontKnow() {
      if (studyQueue.length === 0) return;
      const cardToRepeat = studyQueue.shift();
      studyQueue.push(cardToRepeat);
      loadNextCard();
    }

    let isDragging = false;
    let startX = 0, startY = 0;
    let isTap = true;

    dragWrapper.addEventListener('pointerdown', (e) => {
      if (studyQueue.length === 0) return;
      isDragging = true;
      isTap = true;
      startX = e.clientX;
      startY = e.clientY;
      dragWrapper.style.transition = 'none';
      dragWrapper.setPointerCapture(e.pointerId);
    });

    dragWrapper.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;

      if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
        isTap = false;
      }

      dragWrapper.style.transform = `translate(${deltaX}px, ${deltaY}px) rotate(${deltaX * 0.05}deg)`;

      const opacityKnow = Math.max(0, Math.min(1, deltaX / 100));
      const opacityDontKnow = Math.max(0, Math.min(1, -deltaX / 100));
      overlayKnow.style.opacity = opacityKnow;
      overlayDontKnow.style.opacity = opacityDontKnow;
    });

    dragWrapper.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const deltaX = e.clientX - startX;

      if (isTap) {
        isFlipped = !isFlipped;
        card.classList.toggle('is-flipped');
        dragWrapper.style.transition = 'transform 0.3s ease';
        dragWrapper.style.transform = '';
        return;
      }

      if (deltaX > 80) {
        swipeOut('right');
      } else if (deltaX < -80) {
        swipeOut('left');
      } else {
        dragWrapper.style.transition = 'transform 0.3s ease';
        dragWrapper.style.transform = '';
        overlayKnow.style.opacity = 0;
        overlayDontKnow.style.opacity = 0;
      }
    });

    dragWrapper.addEventListener('pointercancel', () => {
      isDragging = false;
      dragWrapper.style.transition = 'transform 0.3s ease';
      dragWrapper.style.transform = '';
      overlayKnow.style.opacity = 0;
      overlayDontKnow.style.opacity = 0;
    });

    function swipeOut(direction) {
      const width = window.innerWidth;
      const deltaX = direction === 'right' ? width : -width;

      dragWrapper.style.transition = 'transform 0.3s ease';
      dragWrapper.style.transform = `translate(${deltaX}px, 0px) rotate(${deltaX * 0.05}deg)`;

      setTimeout(() => {
        if (direction === 'right') {
          handleKnow();
        } else {
          handleDontKnow();
        }
      }, 300);
    }

    document.getElementById('knowBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (studyQueue.length > 0) swipeOut('right');
    });

    document.getElementById('dontKnowBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (studyQueue.length > 0) swipeOut('left');
    });

    document.getElementById('flipBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (studyQueue.length === 0) return;
      isFlipped = !isFlipped;
      card.classList.toggle('is-flipped');
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      initSession();
    });

    // --- Переключатель вариантов ---
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const mode = btn.dataset.mode;
        if (mode === currentMode) return;

        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.mode === mode);
        });

        initSession();
      });
    });

    initSession();

  </script>
</body>
</html>
